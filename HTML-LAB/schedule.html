<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schedule</title>
</head>
<body>
    <h2>Weekly Class Schedule</h2>
    <table border="1" cellpadding="5" cellspacing="0">
        <tr>
            <th>Day</th>
            <th>Time</th>
            <th>Subject</th>
            <th>Room</th>
            <th>Instructor</th>
        </tr>
        <tr>
            <td rowspan="2">Monday</td>
            <td>10:30 AM - 12:00 PM</td>
            <td>Web Development</td>
            <td>LAB 1</td>
            <td>Instructor</td>
        </tr>
        <tr class="break-row">
            <td colspan="5">LUNCH BREAK (12:00 PM - 1:00 PM)</td>
        </tr>
        <tr>
            <td>Tuesday</td>
            <td>1:00 PM - 4:00 PM</td>
            <td colspan="2">Database (FLD / TBA)</td>
            <td>Instructor</td>
        </tr>
    </table>
</body>
</html>
